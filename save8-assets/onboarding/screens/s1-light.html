<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#0E0F0C;--muted:#6A6C6A;--line:rgba(14,15,12,.10);--photo:#F4F4F6;--sheet:#F2F2F7;--tile:#fff;--star:#E6A100}
.dark{--bg:#0E1116;--ink:#fff;--muted:#A0A3A8;--line:rgba(255,255,255,.10);--photo:#1A1D22;--sheet:#1C1C1E;--tile:#2C2C2E}
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden;position:relative}
.nav{display:flex;justify-content:space-between;align-items:center;padding:56px 16px 8px;font-size:20px}
.ph{margin:8px 16px;height:300px;border-radius:20px;background:var(--photo);display:grid;place-items:center}.ph img{width:250px;mix-blend-mode:multiply}.dark .ph img{mix-blend-mode:normal;border-radius:16px;width:230px}
.info{padding:12px 16px}.t{font-size:18px;font-weight:600;line-height:24px}.r{font-size:13px;color:var(--muted);margin-top:6px}.r b{color:var(--star)}
.p{font-size:26px;font-weight:800;margin-top:8px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:22px 22px 0 0;padding:10px 16px 34px}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(120,120,128,.4);margin:0 auto 12px}
.hd{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}.hd .th{width:40px;height:40px;border-radius:8px;background:var(--photo);overflow:hidden}.hd .th img{width:100%}
.hd .x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(120,120,128,.2);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.apps{display:flex;justify-content:space-between;padding:16px 4px 6px}
.app{width:64px;text-align:center;font-size:11px;color:var(--ink)}.ic{width:60px;height:60px;border-radius:14px;margin:0 auto 6px;display:grid;place-items:center;font-size:28px;color:#fff;overflow:hidden}
.ic img{width:100%;height:100%}
.hi .ic{box-shadow:0 0 0 3px var(--sheet),0 0 0 6px #E6651A,0 8px 24px rgba(230,101,26,.45)}.hi span{font-weight:700;color:#E6651A}
.acts{background:var(--tile);border-radius:12px;margin-top:14px}.a{display:flex;justify-content:space-between;padding:13px 14px;font-size:15px;border-top:1px solid var(--line)}.a:first-child{border-top:0}
</style></head><body class="">

<div class="dim"></div>
<div class="sheet"><div class="grab"></div>
 <div class="hd"><div class="th"><img src="sony-wh-1000xm5-black.jpg"></div><div><div style="font-size:14px;font-weight:600">Sony WH-1000XM5</div><div style="font-size:12px;color:var(--muted)">amazon.in</div></div><div class="x">✕</div></div>
 <div class="apps">
  <div class="app"><div class="ic" style="background:linear-gradient(#5AC8FA,#007AFF)">◎</div>AirDrop</div>
  <div class="app"><div class="ic" style="background:#34C759">💬</div>Messages</div>
  <div class="app"><div class="ic" style="background:#25D366">✆</div>WhatsApp</div>
  <div class="app hi"><div class="ic"><img src="save8-app-icon.png"></div><span>Save8</span></div>
 </div>
 <div class="acts"><div class="a">Copy Link<span>🔗</span></div><div class="a">Add to Reading List<span>👓</span></div></div>
</div></body></html>
